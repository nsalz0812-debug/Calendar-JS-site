
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紫霞雪影 · 2027 冊曆</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #fbf8f1;
  color: #39352f;
  font-family: "Noto Serif KR", serif;
}

.cover {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
  background: linear-gradient(135deg,#f8f4eb,#fffdf8,#f0ece2);
  border: 12px double #d9c7a5;
}

.cover h1 {
  font-size: clamp(38px,10vw,70px);
  letter-spacing: 8px;
  margin: 28px 0 10px;
  color: #c5a04b;
}

.cover p {
  color: #bca06b;
  letter-spacing: 5px;
}

button {
  font: inherit;
  cursor: pointer;
}

.cover button {
  margin: 12px;
  padding: 12px 22px;
  background: #fffdf8;
  border: 1px solid #cdbb98;
  color: #7d7669;
}

main {
  max-width: 1000px;
  margin: auto;
  padding: 32px 18px;
}

h2 {
  font-size: 32px;
  font-weight: 400;
}

.intro {
  color: #777568;
  line-height: 1.8;
}

/* 달력: 한 줄에 하나 */
.gallery {
  display: grid;
  grid-template-columns: minmax(0,1fr);
  gap: 30px;
  margin-top: 28px;
}

.card {
  min-width: 0;
  cursor: pointer;
}

.art {
  width: 100%;
  aspect-ratio: 3 / 2;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border: 1px solid #e5dfd2;
  background: #f0ece2;
}

.art img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.placeholder {
  width: 100%;
  height: 100%;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  color: #777568;
}

.placeholder strong {
  font-size: clamp(15px,3vw,25px);
  font-weight: 400;
  letter-spacing: 2px;
}

.placeholder small {
  font-size: 10px;
}

.caption {
  padding: 10px 2px;
  color: #777568;
  font-size: 13px;
}

.card:nth-child(6n+1) .art { background: #d7e1d0; }
.card:nth-child(6n+2) .art { background: #e9d7d2; }
.card:nth-child(6n+3) .art { background: #d9e5e5; }
.card:nth-child(6n+4) .art { background: #ead7b9; }
.card:nth-child(6n+5) .art { background: #e2e5c9; }
.card:nth-child(6n) .art { background: #d5e2e9; }

/* 특전: 한 줄에 두 개, 정사각형 */
.bonus {
  margin-top: 60px;
  padding: 30px 0;
  border-top: 1px solid #e5dfd2;
}

.bonus-gallery {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 16px;
  margin-top: 24px;
}

.bonus-card {
  min-width: 0;
  cursor: pointer;
}

.bonus-art {
  width: 100%;
  aspect-ratio: 1 / 1;
  overflow: hidden;
  border: 1px solid #e5dfd2;
  background: #f0ece2;
}

.bonus-art img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.bonus-caption {
  padding: 8px 2px;
  color: #777568;
  font-size: 12px;
}

.bonus-card:nth-child(6n+1) .bonus-art { background: #d7e1d0; }
.bonus-card:nth-child(6n+2) .bonus-art { background: #e9d7d2; }
.bonus-card:nth-child(6n+3) .bonus-art { background: #d9e5e5; }
.bonus-card:nth-child(6n+4) .bonus-art { background: #ead7b9; }
.bonus-card:nth-child(6n+5) .bonus-art { background: #e2e5c9; }
.bonus-card:nth-child(6n) .bonus-art { background: #d5e2e9; }

/* 사진 확대 창 */
#modal {
  display: none;
  position: fixed;
  inset: 0;
  background: #26251fee;
  z-index: 5;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

#modal.show { display: flex; }

.modalbox {
  width: min(100%,900px);
  max-height: 95svh;
  overflow-y: auto;
  padding: 16px;
  background: #fbf8f1;
  text-align: center;
}

.modalbox .art {
  max-height: 72svh;
}

.modalbox .bonus-large {
  width: 100%;
  aspect-ratio: 1 / 1;
  max-height: 72svh;
  overflow: hidden;
}

.modalbox .bonus-large img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.modalbox button {
  padding: 10px 16px;
  margin: 12px 5px;
  border: 1px solid #cdbb98;
  background: #fffdf8;
}

footer {
  margin-top: 40px;
  padding: 20px 0;
  border-top: 1px solid #e5dfd2;
  color: #777568;
  font-size: 11px;
}

@media (max-width:560px) {
  main { padding: 24px 14px; }
  .cover { border-width: 6px; }
  .gallery { gap: 22px; }
  .bonus-gallery { gap: 12px; }
  .modalbox { padding: 10px; }
}
</style>
</head>

<body>

<section class="cover">
  <h1>紫霞雪影</h1>
  <p>2027 冊曆</p>
  <div>2027 자하설영 비공식 달력 합작</div>

  <button onclick="document.getElementById('gallery').scrollIntoView({behavior:'smooth'})">
    달력 페이지 펼쳐 보기 ↓
  </button>

  <button onclick="document.getElementById('bonus').scrollIntoView({behavior:'smooth'})">
    특전 페이지 펼쳐 보기 ↓
  </button>
</section>

<main>
  <p>紫霞雪影 · 2027 CALENDAR</p>
  <h2>落花</h2>

  <p class="intro">
    달력 페이지 미리보기입니다.<br>
    일러스트의 무단 저장 및 배포를 금지합니다.
  </p>

  <section class="gallery" id="gallery"></section>

  <section class="bonus" id="bonus">
    <p>SPECIAL BENEFIT</p>
    <h2>특전 페이지</h2>
    <p class="intro">
      자하설영 2027 달력 특전 미리보기입니다.<br>
      일러스트의 무단 저장 및 배포를 금지합니다.
    </p>

    <div class="bonus-gallery" id="bonusGallery"></div>
  </section>

  <footer>PREVIEW ONLY</footer>
</main>

<div id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modalbox">
    <div id="large"></div>
    <button onclick="change(-1)">← 이전</button>
    <button onclick="closeModal()">닫기</button>
    <button onclick="change(1)">다음 →</button>
  </div>
</div>

<script>
/* 표지 + 1월부터 12월까지 */
const months = [
  ['표지','COVER'],
  ['1월','January'],
  ['2월','February'],
  ['3월','March'],
  ['4월','April'],
  ['5월','May'],
  ['6월','June'],
  ['7월','July'],
  ['8월','August'],
  ['9월','September'],
  ['10월','October'],
  ['11월','November'],
  ['12월','December']
];

/* 달력 이미지 13개 */
const images = [
  'images/cover.PNG',
  'images/01.jpg',
  'images/02.jpg',
  'images/03.jpg',
  'images/04.jpg',
  'images/05.jpg',
  'images/06.jpg',
  'images/07.jpg',
  'images/08.jpg',
  'images/09.jpg',
  'images/10.jpg',
  'images/11.jpg',
  'images/12.jpg'
];

/* 특전 이미지 8개 */
const bonusImages = [
  'images/bonus01.jpg',
  'images/bonus02.jpg',
  'images/bonus03.jpg',
  'images/bonus04.jpg',
  'images/bonus05.jpg',
  'images/bonus06.jpg',
  'images/bonus07.jpg',
  'images/bonus08.jpg'
];

let current = 0;
let currentType = 'calendar';

function artwork(i) {
  const m = months[i];

  return `
    <div class="art">
      <img
        src="${images[i]}"
        alt="${m[0]} 달력 그림"
        onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
      >
      <div class="placeholder" style="display:none">
        <strong>${m[1]}</strong>
        <p>${m[0]}</p>
        <small>이미지 파일을 연결해 주세요</small>
      </div>
    </div>
  `;
}

/* 달력 페이지 만들기 */
const gallery = document.getElementById('gallery');

months.forEach((m, i) => {
  const card = document.createElement('article');
  card.className = 'card';

  card.innerHTML = artwork(i) +
    `<div class="caption">${
      i === 0 ? '달력 표지 · COVER IMAGE' : m[0] + ' · MONTHLY IMAGE'
    }</div>`;

  card.onclick = () => openCalendar(i);
  gallery.appendChild(card);
});

/* 특전 페이지 만들기 */
const bonusGallery = document.getElementById('bonusGallery');

bonusImages.forEach((src, i) => {
  const card = document.createElement('article');
  card.className = 'bonus-card';

  card.innerHTML = `
    <div class="bonus-art">
      <img
        src="${src}"
        alt="특전 ${i + 1}"
        onerror="this.style.display='none'"
      >
    </div>
    <div class="bonus-caption">
      SPECIAL BENEFIT · ${String(i + 1).padStart(2,'0')}
    </div>
  `;

  card.onclick = () => openBonus(i);
  bonusGallery.appendChild(card);
});

/* 달력 확대 */
function openCalendar(i) {
  current = i;
  currentType = 'calendar';
  document.getElementById('large').innerHTML = artwork(i);
  document.getElementById('modal').classList.add('show');
}

/* 특전 확대 */
function openBonus(i) {
  current = i;
  currentType = 'bonus';
  showBonus(i);
  document.getElementById('modal').classList.add('show');
}

function showBonus(i) {
  document.getElementById('large').innerHTML = `
    <div class="bonus-large">
      <img src="${bonusImages[i]}" alt="특전 ${i + 1}">
    </div>
    <p>SPECIAL BENEFIT · ${String(i + 1).padStart(2,'0')}</p>
  `;
}

/* 이전 / 다음 */
function change(n) {
  if (currentType === 'calendar') {
    current = (current + n + months.length) % months.length;
    document.getElementById('large').innerHTML = artwork(current);
  } else {
    current = (current + n + bonusImages.length) % bonusImages.length;
    showBonus(current);
  }
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();

  if (document.getElementById('modal').classList.contains('show')) {
    if (e.key === 'ArrowLeft') change(-1);
    if (e.key === 'ArrowRight') change(1);
  }
});
</script>

</body>
</html>
